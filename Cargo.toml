[package]
name = "wisp"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "14"
futures = { version = "0.3", default-features = false, features = ["executor"] }

